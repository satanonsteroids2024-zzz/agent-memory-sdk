name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check agent_memory/ mcp_server/ tests/

      - name: Type check (mypy, enforced)
        run: mypy agent_memory/ mcp_server/

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  test-semantic:
    # Exercises the optional sqlite-vec + fastembed vector-search path.
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies with semantic extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,semantic]"

      - name: Run full test suite with embeddings active
        run: python -m pytest tests/ -v --tb=short

  eval:
    # Decision-quality evaluation over all datasets, including trap cases.
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run evaluation datasets
        run: agent-memory --data-dir /tmp/eval-mem eval

      - name: Run benchmark
        run: agent-memory --data-dir /tmp/bench-mem benchmark --seed --repeat 3

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          # Generate a valid PEP 440 version
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF_NAME#v}
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            VERSION="0.0.0.dev0+$(git rev-parse --short HEAD)"
          else
            BRANCH=$(echo "${GITHUB_REF_NAME}" | sed 's/[^a-zA-Z0-9]/-/g')
            VERSION="0.0.0.dev0+${BRANCH}.$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=${VERSION}"
          docker build --build-arg VERSION="${VERSION}" -t agent-memory:latest .

      - name: Test Docker image with SQLite backend
        run: |
          docker run --rm agent-memory:latest --help
          docker run --rm -v agent_memory_data:/home/appuser/.agent_memory agent-memory:latest remember "test" "test response"
          docker run --rm -v agent_memory_data:/home/appuser/.agent_memory agent-memory:latest resolve "test"

      - name: Test Docker image with ChromaDB backend
        run: |
          docker run --rm -v agent_memory_chromadb:/home/appuser/.agent_memory agent-memory:latest remember "test" "test response" --backend chromadb
          docker run --rm -v agent_memory_chromadb:/home/appuser/.agent_memory agent-memory:latest resolve "test" --backend chromadb
